server:
  port: 8088

spring:
  application:
    name: admin

  jpa:
    hibernate:
      ddl-auto: update

  jackson:
    time-zone: Asia/Seoul

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${USER_NAME}
    password: ${PASSWORD}

  kafka:
    bootstrap-servers: awoofinance-kafka:9092

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

ssafy :
  finance :
    api_key : ${SSAFY_API_KEY}

aes :
  secret_key : ${AES_KEY}